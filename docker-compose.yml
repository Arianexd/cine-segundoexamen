version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cine_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cinedb
    ports:
      - "5432:5432"
    networks:
      - cine_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: cine_api
    environment:
      - DATABASE_URL=postgresql://postgres:admin123@db:5432/cinedb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - cine_network

  gateway:
    build: ./gateway
    container_name: cine_gateway
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - cine_network

networks:
  cine_network:
    driver: bridge